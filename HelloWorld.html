<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Exercise 09</title>
  <style>
    .box {
      width: 300px;
      padding: 10px;
      margin: 15px 0;
      font-size: 24px;
      font-weight: bold;
      font-family: serif;
    }

    .box1 {
      background-color: #add8e6;
      border: 4px double #ff6347;
      outline: 2px solid #ff6347;
      outline-offset: 3px;
    }

    .box2 {
      background-color: #ffff00;
      border: 3px solid #007bff;
      border-radius: 12px;
    }

    .box3 {
      background-color: #3cb371;
      border: 4px dotted #a9a9a9;
    }
  </style>
</head>
<body>

  <div class="box box1">Hello World</div>
  <div class="box box2">Hello World</div>
  <div class="box box3">Hello World</div>

</body>
</html>

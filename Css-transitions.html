<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 13</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background-color: pink;
      margin-bottom: 20px;
      transition: width 1s, height 1s;
    }

    /* Square 1: becomes longer on hover */
    .box1:hover {
      width: 400px;
    }

    /* Square 2: becomes larger on hover */
    .box2:hover {
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>

  <div class="box box1">1</div>
  <div class="box box2">2</div>

</body>
</html>
